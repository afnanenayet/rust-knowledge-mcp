name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Mostly required so we can publish annotations for tests
permissions:
    contents: read
    checks: write
    id-token: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # Need to disable incremental builds for sccache support
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          components: llvm-tools-preview
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      # Clippy must run on nightly: the workspace lint config uses nightly-only lints (see AGENTS.md).
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component clippy
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Clippy
        run: cargo +nightly clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Run doctests
        run: cargo test --doc
      - name: Collect coverage data
        env:
          NEXTEST_PROFILE: ci
        run: |
          cargo llvm-cov --no-report nextest
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Publish Test Report
        id: report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "target/nextest/**/*.xml"
          check_annotations: true
          include_passed: true
          include_skipped: true
