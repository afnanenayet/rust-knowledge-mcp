[package]
name = "knowledge-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing the rust-knowledge retrieval engine"

[lib]
name = "knowledge_mcp"
path = "src/lib.rs"

[[bin]]
name = "knowledge-mcp"
path = "src/main.rs"

[dependencies]
knowledge-core = { workspace = true }
knowledge-index = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rmcp = { version = "3.2.0", features = ["client"] }
tempfile = "3"
